<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>聯繫 — AURÈLE</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Inter:wght@300;400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../custom.css">
</head>
<body>
    <a href="../../../index.html" class="dv-back">← DesignVault</a>

    <nav class="navbar navbar-expand-lg fixed-top" id="mainNav">
        <div class="container">
            <a class="navbar-brand" href="../">AURÈLE</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#auNav" aria-controls="auNav" aria-expanded="false" aria-label="Toggle navigation"><span class="navbar-toggler-icon"></span></button>
            <div class="collapse navbar-collapse" id="auNav">
                <ul class="navbar-nav ms-auto gap-3">
                    <li class="nav-item"><a class="nav-link" href="../story/">故事</a></li>
                    <li class="nav-item"><a class="nav-link" href="../collections/">系列</a></li>
                    <li class="nav-item"><a class="nav-link" href="../works/">作品</a></li>
                    <li class="nav-item"><a class="nav-link active" href="./">聯繫</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <section class="au-page-header">
        <div class="container">
            <a href="../" class="back-link">← 返回 AURÈLE</a>
            <p class="section-tag mt-3 mb-2">Contact</p>
            <h1 class="section-title">預約展示</h1>
        </div>
    </section>

    <section class="py-5">
        <div class="container">
            <div class="row g-4 g-lg-5">
                <div class="col-12 col-lg-4">
                    <p class="section-tag mb-3">預約展示</p>
                    <h2 class="section-title mb-4">與我們聯繫</h2>
                    <p class="text-muted mb-4" style="font-size:0.875rem;line-height:1.9;">我們提供私人展示服務，歡迎預約了解最新系列。</p>
                    <div class="d-flex flex-column gap-3 small text-muted">
                        <div><svg class="ui-icon" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-6.5-6-6.5-11a6.5 6.5 0 0 1 13 0c0 5-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.3"/></svg> 台北市大安區仁愛路四段</div>
                        <div><svg class="ui-icon" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="7" y="3" width="10" height="18" rx="2"/><path d="M11 17.500h2"/></svg> +886 2 2345 6789</div>
                        <div><svg class="ui-icon" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="1.5"/><path d="M3.5 6.500L12 13l8.5-6.5"/></svg> aurele@example.com</div>
                        <div><svg class="ui-icon" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg> 週二至週六 11:00–19:00</div>
                    </div>
                </div>
                <div class="col-12 col-lg-7 offset-lg-1">
                    <form class="d-flex flex-column gap-4">
                        <div>
                            <label class="section-tag d-block mb-2" for="contact-name">姓名</label>
                            <input type="text" id="contact-name" class="au-input w-100" placeholder="您的姓名">
                        </div>
                        <div>
                            <label class="section-tag d-block mb-2" for="contact-email">電子郵件</label>
                            <input type="email" id="contact-email" class="au-input w-100" placeholder="email@example.com">
                        </div>
                        <div>
                            <label class="section-tag d-block mb-2" for="contact-date">偏好日期</label>
                            <input type="date" id="contact-date" class="au-input w-100">
                        </div>
                        <div>
                            <label class="section-tag d-block mb-2" for="contact-notes">備註</label>
                            <textarea id="contact-notes" class="au-input w-100" rows="4" placeholder="請說明您的需求或問題..."></textarea>
                        </div>
                        <div>
                            <button type="submit" class="btn-au">送出預約</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </section>

    <footer class="au-footer py-4">
        <div class="container d-flex justify-content-between small">
            <span style="font-family:'Cormorant Garamond',serif;letter-spacing:3px;color:#fff;">AURÈLE</span>
            <span>© 2026</span>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>window.addEventListener('scroll',()=>{document.getElementById('mainNav').classList.toggle('scrolled',window.scrollY>50);});</script>
</body>
</html>
